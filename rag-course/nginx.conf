# nginx 反代配置：HTTPS 终结 + 转发真实 IP + SSE 支持
# 使用：docker-compose 挂载到 /etc/nginx/conf.d/kb.conf

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name  192.168.1.16;   # 本机实际 IP；切换域名时改这里（见 docs/domain-switch.md）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 192.168.1.16;   # 本机实际 IP；切换域名时改这里（见 docs/domain-switch.md）

    ssl_certificate     /etc/nginx/certs/kb.crt;
    ssl_certificate_key /etc/nginx/certs/kb.key;

    # 后端 API（含 SSE 流式问答）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # 覆盖写真实客户端 IP（不要用 $proxy_add_x_forwarded_for，它会追加客户端伪造的头）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # SSE：必须关缓冲 + 放宽超时，否则流式输出会被 nginx 攒住
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }

    # Streamlit 前端（含 websocket）
    location / {
        proxy_pass http://ui:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
