services:
  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    depends_on:
      - backend
      - ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 顶替镜像自带的 default.conf，避免它抢占 80 端口返回 404
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro   # 把 kb.crt / kb.key / ca.crt 放进 certs/
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui.Dockerfile
    container_name: rag-ui
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000   # 容器内通过服务名访问后端
    volumes:
      - ./data/sample:/app/data/sample   # 与 backend 共享文档目录，上传互通
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    volumes:
      - ollama_data:/root/.ollama   # 模型持久化：拉一次，重启不丢
    # 不暴露端口：backend 通过内部网络服务名 ollama:11434 连接；
    # 宿主机的 11434 留给本机原生 Ollama，避免端口冲突
    # GPU 直通：有 NVIDIA 显卡时生效；没有就注释掉这段（CPU 也能跑，只是慢）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: .
    container_name: rag-backend
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434   # 容器内用服务名连 Ollama，而不是 127.0.0.1
    volumes:
      - app_data:/app/data                # Chroma 索引 + 审计日志持久化
      - ./data/sample:/app/data/sample    # 与 ui 共享文档目录，上传互通
    ports:
      - "127.0.0.1:8000:8000"             # 只绑本机（调试 XFF 用）；公网入口只剩 nginx
    restart: unless-stopped

volumes:
  ollama_data:
  app_data:
