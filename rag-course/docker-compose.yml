services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    volumes:
      - ollama_data:/root/.ollama   # 模型持久化：拉一次，重启不丢
    ports:
      - "11434:11434"
    # GPU 直通：有 NVIDIA 显卡时生效；没有就注释掉这段（CPU 也能跑，只是慢）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: .
    container_name: rag-backend
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434   # 容器内用服务名连 Ollama，而不是 127.0.0.1
    volumes:
      - app_data:/app/data                # Chroma 索引 + 审计日志持久化
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ollama_data:
  app_data: